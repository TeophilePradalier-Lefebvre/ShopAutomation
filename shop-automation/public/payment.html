<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Payment</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #fff; color: #0f172a; }
    label { display: block; font-weight: 600; font-size: 12px; margin: 0 0 6px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; box-sizing: border-box; }
  </style>
</head>
<body>
  <label for="card-number">Card number</label>
  <input id="card-number" name="card-number" autocomplete="cc-number" placeholder="4242 4242 4242 4242" />
</body>
</html>
